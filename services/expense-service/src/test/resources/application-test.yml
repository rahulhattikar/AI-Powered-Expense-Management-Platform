server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      fail-fast: false
      auto-create: false

  data:
    redis:
      host: localhost
      port: 6379


  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LWJhc2U2NC1lbmNvZGVkLWtleS1mb3ItdGVzdGluZy1vbmx5IQ==
    expiration-ms: 86400000

logging:
  level:
    root: WARN
    com.aiexpense.expenseservice: INFO
    org.springframework.security: DEBUG