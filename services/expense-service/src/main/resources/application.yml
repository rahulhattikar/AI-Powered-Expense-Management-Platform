server:
  port: 8083

spring:
    application:
        name: expense-service

    datasource:
      url: jdbc:postgresql://postgres:5432/expense-service_db
      username: ${DB_USERNAME:}
      password: ${DB_PASSWORD:}
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
         ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
            format_sql: true
            show_sql: true
            jdbc:
              time_zone: Asia/Kolkata

    flyway:
      enabled: true
      locations: classpath:db/migration
      table: flyway_schema_history

    data:
      redis:
        host: ${REDIS_HOST:redis}
        port: ${REDIS_PORT:6379}
        timeout: 60000ms

    kafka:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        acks: all
      consumer:
        group-id: expense-service-group
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
        properties:
          spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
          spring.json.use.type.headers: false
          spring.json.value.default.type: com.aiexpense.expenseservice.event.ExpenseEvent

    jwt:
      secret: ${SPRING_JWT_SECRET:}
      expiration-ms: ${SPRING_JWT_EXPIRATION_MS:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    root: INFO
    com.aiexpense.expenseservice: DEBUG
    org.springframework.kafka: INFO
    org.springframework.cache: DEBUG
    com.aiexpense.expenseservice.security: INFO



